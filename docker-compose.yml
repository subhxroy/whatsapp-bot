version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: wp_bot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: wp_bot_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MESSAGE_LOGGING: ${MESSAGE_LOGGING:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      BOT_OWNER_NUMBER: ${BOT_OWNER_NUMBER}
    ports:
      - "4000:4000"
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: wp_bot_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: wp_bot_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  redis_data:
  caddy_data:
  caddy_config:
