[build]
  command = "npx pnpm --filter @private-md-bot/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20.18.0"
  COREPACK_ENABLE_STRICT_CHECK = "0"
  COREPACK_INTEGRITY_KEYS = "0"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  from = "/api/*"
  to = "https://caldera-bot-api.onrender.com/api/:splat"
  status = 200
