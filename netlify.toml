[build]
  command = "pnpm --filter @private-md-bot/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20.19.2"
  PNPM_VERSION = "10.34.5"
  NETLIFY_USE_PNPM = "true"
  COREPACK_ENABLE_STRICT = "0"

[[redirects]]
  from = "/api/*"
  to = "https://caldera-bot-api.onrender.com/api/:splat"
  status = 200
