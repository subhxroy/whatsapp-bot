[build]
  command = "pnpm --filter @private-md-bot/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22.0.0"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "https://your-api-render-service.onrender.com/api/:splat"
  status = 200
